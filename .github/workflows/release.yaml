name: Release komodo

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      additional-env:
        description: Additional env var key value pairs, e.g. "FORCE_BUILD=true SKIP_ROOTLESS=true"
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout rooted-graphene script repository
        uses: actions/checkout@v4
        with:
          repository: schnatterer/rooted-graphene
          fetch-depth: 1
      - name: Checkout OTA repository for updating OTA server on GitHub Pages
        uses: actions/checkout@v4
        with:
          path: ota
          fetch-depth: 0
      - name: Set additional env
        run: |
          IFS=' ' read -r -a env_vars <<< '${{ github.event.inputs.additional-env || '' }}'
          for key_value_pair in "${env_vars[@]}"; do
            echo "$key_value_pair" >> $GITHUB_ENV
          done
      - run: sudo apt-get install -y jq curl git

      # TEMPORARY: pixincreate renamed his release asset (Magisk-vX.apk instead of app-release.apk)
      - name: Pre-seed pixincreate magisk (asset name changed in v30.9)
        run: |
          mkdir -p .tmp
          curl -fsSL -o .tmp/pixincreate-v30.9.apk \
            "https://github.com/pixincreate/Magisk/releases/download/v30.9/Magisk-v30.9.apk"
          curl -fsSL "https://github.com/pixincreate/Magisk/releases/download/v30.9/SHA256SUMS" \
            | grep "Magisk-v30.9.apk" | sed 's|Magisk-v30.9.apk|.tmp/pixincreate-v30.9.apk|' | sha256sum -c
      # TEMPORARY, avbroot 3.33.0 doesn't know Magisk versionCode 30800 (v30.9 pixincreate) yet,
      # so pre-seed my-avbroot-setup with --ignore-magisk-warnings added to ota patch.
      - name: Pre-seed my-avbroot-setup with --ignore-magisk-warnings
        run: |
          PATCH_PY_COMMIT=$(grep -oP '^PATCH_PY_COMMIT=\K\w+' rooted-ota.sh)
          git clone https://github.com/chenxiaolong/my-avbroot-setup .tmp/my-avbroot-setup
          git -C .tmp/my-avbroot-setup checkout "$PATCH_PY_COMMIT"
          python3 - <<'EOF'
          from pathlib import Path
          p = Path('.tmp/my-avbroot-setup/lib/external.py')
          s = p.read_text()
          anchor = "        *extra_args,\n    ]\n"
          assert s.count(anchor) == 1, "external.py changed; update this patch"
          s = s.replace(anchor, anchor +
              "\n    if '--magisk' in cmd:\n"
              "        cmd.append('--ignore-magisk-warnings')\n")
          p.write_text(s)
          print("patched external.py")
          EOF

      - name: release
        env:
          DEVICE_ID: komodo # Pixel 9 Pro XL
          MAGISK_PREINIT_DEVICE: sda10
          SKIP_PIXINCREATE: 'false'
          SKIP_MAGISK: 'true'
          MAGISK_VERSION: 'v30.9'
          PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB }}
          PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA }}
          KEY_AVB_BASE64: ${{ secrets.KEY_AVB_BASE64 }}
          CERT_OTA_BASE64: ${{ secrets.CERT_OTA_BASE64 }}
          KEY_OTA_BASE64: ${{ secrets.KEY_OTA_BASE64 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PAGES_REPO_FOLDER: 'ota'
        run: |
          DEBUG=1 bash -c '. rooted-ota.sh && createAndReleaseRootedOta'
